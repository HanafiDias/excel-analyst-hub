<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk / Daftar — Excel Analyst Hub</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <script src="assets/js/session.js" defer></script>
  
  <style>
    /* =========================================
       ANIMASI BACKGROUND LOOPING (GOD MODE)
       ========================================= */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Mencegah scrollbar bocor karena animasi */
      font-family: 'Inter', sans-serif;
      position: relative;
    }

    /* Grid Garis Data Latar Belakang */
    .bg-grid {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      animation: panGrid 20s linear infinite;
    }

    @keyframes panGrid {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    /* Bola Energi Melayang 1 (Biru Premium) */
    .orb-1 {
      position: absolute;
      top: -15%; left: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(60px);
      z-index: 1;
      animation: floatOrb1 12s infinite alternate ease-in-out;
    }

    /* Bola Energi Melayang 2 (Emas/Warning) */
    .orb-2 {
      position: absolute;
      bottom: -15%; right: -10%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.2) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
      animation: floatOrb2 15s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(100px, 50px) scale(1.2); }
    }
    
    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-80px, -60px) scale(1.1); }
    }

    /* =========================================
       GLASSMORPHISM LOGIN CARD
       ========================================= */
    .glass-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 2.5rem;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes cardEntrance {
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
    }

    .form-title {
      text-align: center;
      color: #f8fafc;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .form-subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* Input Fields Premium */
    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-group label {
      display: block;
      color: #cbd5e1;
      font-size: 0.8rem;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .glass-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
      box-sizing: border-box;
    }

    .glass-input:focus {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.05);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Tombol Super Glow */
    .btn-glow {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(99, 102, 241, 0.5);
    }

    .btn-glow::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.3), rgba(255,255,255,0));
      animation: btnShine 3s infinite;
    }

    @keyframes btnShine {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    /* Tombol Kembali ke Beranda (Melayang Tanpa Session) */
    .btn-back-home {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-back-home:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transform: translateX(-3px);
    }
    /* =========================================
       SISTEM TAB LOGIN/REGISTER
       ========================================= */
    .tab-container {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: rgba(59, 130, 246, 0.2);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .tab-btn:hover:not(.active) {
      color: #e2e8f0;
    }

    #auth-helper-text a:hover {
      text-decoration: underline !important;
      color: #6366f1 !important;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <a href="index.html" class="btn-back-home">
    <span aria-hidden="true">←</span> Kembali ke Beranda
  </a>

  <div class="glass-card">
    <div class="brand-logo">⊞</div>
    <h1 class="form-title">Portal Analis</h1>
    <p class="form-subtitle">Satu langkah menuju keahlian kelas industri.</p>

    <div class="tab-container">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar Baru</button>
    </div>

    <div id="auth-form-container">
      <div class="input-group">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" class="glass-input" placeholder="contoh@email.com" required>
      </div>
      
      <div class="input-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" class="glass-input" placeholder="Minimal 6 karakter" required>
      </div>

      <button id="auth-btn" class="btn-glow">Masuk ke Ekosistem ✨</button>
      
      <div style="text-align: center; margin-top: 1.5rem;">
        <p id="auth-helper-text" style="color: #64748b; font-size: 0.8rem;">
          Lupa kata sandi? <a href="https://wa.me/628XXXXXXXXXX?text=Halo%20Admin%20Excel%20Analyst%20Hub,%20saya%20lupa%20kata%20sandi%20akun%20saya.%20Mohon%20bantuannya%20untuk%20reset%20password" target="_blank" style="color: #3b82f6; text-decoration: none; font-weight: 600;">Hubungi via WA</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // State aplikasi (default: login)
    let isLoginMode = true;

    function switchTab(mode) {
      const btnLogin = document.getElementById('tab-login');
      const btnRegister = document.getElementById('tab-register');
      const authBtn = document.getElementById('auth-btn');
      const helperText = document.getElementById('auth-helper-text');

      if (mode === 'login') {
        isLoginMode = true;
        btnLogin.classList.add('active');
        btnRegister.classList.remove('active');
        authBtn.innerHTML = 'Masuk ke Ekosistem ✨';
        helperText.innerHTML = 'Lupa kata sandi? <a href="https://wa.me/628XXXXXXXXXX?text=Halo%20Admin%20Excel%20Analyst%20Hub,%20saya%20lupa%20kata%20sandi%20akun%20saya.%20Mohon%20bantuannya%20untuk%20reset%20password" target="_blank" style="color: #3b82f6; text-decoration: none; font-weight: 600;">Hubungi via WA</a>';
      } else {
        isLoginMode = false;
        btnRegister.classList.add('active');
        btnLogin.classList.remove('active');
        authBtn.innerHTML = 'Daftar & Mulai Petualangan 🚀';
        helperText.innerHTML = 'Gunakan email asli Anda. Email ini akan menjadi identitas untuk aktivasi paket Premium.';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.supabase) return;
      
      const supabaseUrl = 'https://laowissohsnhfsbiwcpd.supabase.co';
      const supabaseKey = 'sb_publishable_Y_DHtQY18OILqZnAqxaZaw_NC0STTLC';
      const supa = window.supabase.createClient(supabaseUrl, supabaseKey);

      const authBtn = document.getElementById('auth-btn');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      if (!authBtn) return;

      authBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          alert('Harap isi alamat email dan kata sandi.');
          return;
        }

        const originalText = authBtn.innerHTML;
        authBtn.innerHTML = 'Memproses... ✨';
        authBtn.disabled = true;

        try {
          // 1. Coba login terlebih dahulu
          const { data, error } = await supa.auth.signInWithPassword({ email, password });
          
          if (error) {
            // Jika Invalid credentials, coba buat akun baru
            if (error.message.toLowerCase().includes('invalid login credentials')) {
              const { data: signUpData, error: signUpError } = await supa.auth.signUp({ email, password });
              if (signUpError) throw signUpError;
              alert('Akun baru berhasil dibuat! Anda sudah masuk.');
              window.location.href = 'profile.html';
            } else {
              throw error;
            }
          } else {
            alert('Login Berhasil! Selamat datang kembali.');
            window.location.href = 'profile.html';
          }
        } catch (error) {
          alert('Gagal: ' + error.message);
        } finally {
          authBtn.innerHTML = originalText;
          authBtn.disabled = false;
        }
      });
    });
  </script>

</body>
</html>
