<!DOCTYPE html>
<html lang="id">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('eah_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Excel Analyst Hub</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <style>
    html, body { height: 100%; overflow: hidden !important; margin: 0 !important; padding: 0 !important; background: #0b1120; }

    .auth-page-wrapper {
      height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; box-sizing: border-box; padding: 1rem;
    }

    /* =========================================
       1. ANIMASI GLOWING ORBS (MODE AGRESIF & TERLIHAT)
       ========================================= */
    .orb-1, .orb-2 {
      position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0;
      animation: floatOrb 10s infinite ease-in-out; pointer-events: none;
    }
    .orb-1 { 
      width: 450px; height: 450px; background: rgba(59, 130, 246, 0.45); 
      top: -15%; left: -10%; 
    }
    .orb-2 { 
      width: 400px; height: 400px; background: rgba(225, 29, 72, 0.35); 
      bottom: -15%; right: -10%; animation-delay: -5s; 
    }
    
    @keyframes floatOrb {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.5; }
      33% { transform: translate(15vw, 10vh) scale(1.4); opacity: 1; }
      66% { transform: translate(-10vw, 15vh) scale(0.8); opacity: 0.7; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.5; }
    }
    /* =========================================
       2. TOMBOL KEMBALI MELAYANG
       ========================================= */
    .btn-floating-back {
      position: absolute; top: 1.5rem; left: 1.5rem; z-index: 50;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1;
      padding: 8px 16px; border-radius: 50px; font-size: 0.85rem; font-weight: 600;
      text-decoration: none; display: flex; align-items: center; gap: 8px; transition: all 0.3s;
    }
    .btn-floating-back:hover { background: rgba(255, 255, 255, 0.1); color: white; transform: translateX(-4px); }

    /* Desain Kartu Form */
    .auth-card {
      width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 2.5rem;
      position: relative; z-index: 10; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
      text-align: center; animation: cardEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cardEntry { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .auth-card:hover { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 30px rgba(59,130,246,0.1); transition: all 0.4s ease; }

    .logo-badge { display: inline-flex; background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 6px 12px; border-radius: 50px; font-weight: 600; font-size: 0.75rem; border: 1px solid rgba(59, 130, 246, 0.3); margin-bottom: 1.2rem; }
    .auth-card h1 { font-size: 1.8rem; font-weight: 800; color: white; margin-top: 0; margin-bottom: 0.5rem; }
    .auth-card p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }

    .form-group { margin-bottom: 1.2rem; text-align: left; }
    .form-group label { color: #cbd5e1; font-size: 0.75rem; display: block; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    .form-input-premium { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-family: inherit; font-size: 0.95rem; outline: none; box-sizing: border-box; transition: border-color 0.3s; }
    .form-input-premium:focus { border-color: #3b82f6; }

    .btn-login { width: 100%; padding: 16px; background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); margin-top: 1rem; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5); filter: brightness(1.1); }
    .btn-login::after { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); animation: sweepKilat 4s infinite linear; }
    @keyframes sweepKilat { 0% { left: -100%; } 30% { left: 100%; } 100% { left: 100%; } }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    
    <a href="index.html" class="btn-floating-back">← Beranda</a>

    <div class="auth-card">
      <div class="logo-badge">⊞ EXCEL ANALYST HUB</div>
      <h1>Selamat Datang</h1>
      <p>Masuk untuk melanjutkan petualangan data dan akses dashboard premium Anda.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Alamat Email</label>
          <input type="email" id="login-email" class="form-input-premium" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Kata Sandi</label>
          <input type="password" id="login-password" class="form-input-premium" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login" id="submit-btn">Masuk ke Akun</button>
      </form>

      <p style="font-size: 0.85rem; color: #64748b; margin-top: 1.5rem; margin-bottom: 0;">
        Belum punya akses Premium? <br>
        <a href="register.html" style="color: #f59e0b; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 5px;">⚡ Beli Akses di Sini</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (!window.supabase) return;
      const supa = window.supabase.createClient('https://laowissohsnhfsbiwcpd.supabase.co', 'sb_publishable_Y_DHtQY18OILqZnAqxaZaw_NC0STTLC');
      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value.trim();
          const password = document.getElementById('login-password').value;
          const btn = document.getElementById('submit-btn');
          btn.innerText = "Memeriksa..."; btn.disabled = true;
          const { error } = await supa.auth.signInWithPassword({ email: email, password: password });
          if (error) { alert("Gagal masuk: " + error.message); btn.innerText = "Masuk ke Akun"; btn.disabled = false; } 
          else { window.location.href = 'profile.html'; }
        });
      }
    });
  </script>
</body>
</html>
