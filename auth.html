<!DOCTYPE html>
<html lang="id">

<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('eah_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">

  <title>Akses Premium — Excel Analyst Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="page-body" style="display: flex; flex-direction: column; min-height: 100vh;">

  <nav class="nav" role="navigation">
    <div class="nav-inner" style="justify-content: center;">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon" aria-hidden="true">⊞</div>
        Excel Analyst Hub
      </a>
    </div>
  </nav>

  <main class="container fade-in-section"
    style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="card"
      style="max-width: 420px; width: 100%; border-top: 4px solid var(--primary); padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 id="auth-title" style="margin-bottom: 0.5rem;">Masuk ke Akun</h2>
        <p id="auth-subtitle" style="color: var(--text-muted); font-size: 0.95rem;">Lanjutkan petualangan belajarmu</p>
      </div>

      <form id="auth-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <div>
          <label for="email" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Email
            Address</label>
          <input type="email" id="email" required
            style="width: 100%; padding: 0.8rem 1rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit;"
            placeholder="nama@email.com">
        </div>

        <div>
          <label for="password"
            style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Password</label>
          <input type="password" id="password" required
            style="width: 100%; padding: 0.8rem 1rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit;"
            placeholder="••••••••">
        </div>

        <button type="submit" id="auth-submit" class="btn-primary"
          style="width: 100%; margin-top: 0.5rem; padding: 0.8rem; font-size: 1rem;">
          Login Sekarang
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
        <p style="font-size: 0.9rem; color: var(--text-muted);">
          <span id="auth-toggle-text">Belum punya akun Premium?</span>
          <a href="#" id="auth-toggle-btn"
            style="color: var(--primary); font-weight: 600; text-decoration: none;">Daftar di sini</a>
        </p>
      </div>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
</body>

</html>
