<!DOCTYPE html>
<html lang="id">
<head>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('eah_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya — Excel Analyst Hub</title>
  
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/session.js" defer></script>
</head>
<body class="page-body" style="display: flex; flex-direction: column; min-height: 100vh;">

  <nav class="nav" role="navigation">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon" aria-hidden="true">⊞</div>
        Excel Analyst Hub
      </a>
      <div class="nav-links">
        <a href="learn.html" class="nav-item">Belajar</a>
        <a href="leaderboard.html" class="nav-item">Peringkat</a>
      </div>
    </div>
  </nav>

  <main class="container fade-in-section" style="flex: 1; padding: 3rem 1rem;">
    <div style="max-width: 800px; margin: 0 auto;">
      
      <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Dashboard Analis</h1>
          <p style="color: var(--text-muted);">Selamat datang, <strong id="user-email" style="color: var(--primary);">Memuat...</strong></p>
        </div>
        <button id="logout-btn" class="btn-secondary" style="border-color: #ef4444; color: #ef4444;">Logout Akun</button>
      </header>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
        
        <div class="card" style="text-align: center; padding: 2rem 1rem; border-top: 3px solid var(--primary);">
          <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🏆</div>
          <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Level Saat Ini</h3>
          <p id="user-level" style="font-size: 1.5rem; font-weight: bold; margin-top: 0.5rem;">Memuat...</p>
        </div>

        <div class="card" style="text-align: center; padding: 2rem 1rem; border-top: 3px solid var(--accent);">
          <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⚡</div>
          <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Total XP</h3>
          <p id="user-xp" style="font-size: 1.5rem; font-weight: bold; margin-top: 0.5rem;">Memuat...</p>
        </div>

        <div class="card" style="text-align: center; padding: 2rem 1rem; border-top: 3px solid #10b981;">
          <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">💳</div>
          <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Status Akun</h3>
          <p id="user-status" style="font-size: 1.5rem; font-weight: bold; margin-top: 0.5rem; color: #10b981;">Memuat...</p>
        </div>

      </div>

    </div>
  </main>

  <script src="assets/js/profile.js"></script>
</body>
</html>
